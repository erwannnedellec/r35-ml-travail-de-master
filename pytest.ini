[pytest]
# Périmètre canonique de la suite de non-régression.
# Restreint la découverte au répertoire tests/ (223 fonctions, 227 tests collectés).
# Sans cette restriction, un `pytest` a la racine tente de collecter des scripts
# d'expérience mal nommés (consolidation_finale/exp_hpo/test_*.py) qui exécutent
# du code lourd a l'import (chargement du parquet, entraînement) et ne termine pas.
testpaths = tests
